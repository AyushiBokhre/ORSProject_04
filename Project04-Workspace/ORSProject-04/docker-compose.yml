version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ors-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: project04
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  webapp:
    build: .
    container_name: ors-project-04
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data: